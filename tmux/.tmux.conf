set -g base-index 1
# Unlike xterm-256color, this tells programs inside tmux that curly underlines
# and italics work, so nvim sends them.
set -g default-terminal tmux-256color

# Let programs send graphics protocol sequences through to the terminal, which
# is how lf's image previews reach Ghostty.
set -g allow-passthrough on
# Ghostty draws curly and colored underlines, but tmux doesn't detect it, so it
# would pass nvim's spelling and diagnostic underlines on as plain ones.
set -as terminal-features ',xterm-ghostty:usstyle'
# set-option -g default-shell /Users/vladsobal/homebrew/bin/fish

set -sg escape-time 0

set -g status-bg black
set -g status-fg white

setw -g mode-keys vi

# Status {{{
  # Colors {{{
    set -g status-bg '#ececec'
    set -g status-fg '#555555'
    set -g status-left '#[fg=#000000,bold] #S #[default] '
    set -g status-left-length 30
    set -g status-right '#[fg=#666666]%H:%M  %a %-d %b '
 #  set -g status-attr none
  # }}}
# }}}

set-option -g message-style bg=#c1ddff,fg=#000000
set-option -g mode-style bg=#c1ddff,fg=#000000

set-option -g history-limit 50000

# Window {{{
  # Format {{{
    set -g window-status-separator '#[fg=#aaaaaa] · '
    set -g window-status-format "#[fg=#777777]#I #[fg=#333333]#W"
    # set -g window-status-current-format "⌜#I:#W⌟"
    set -g window-status-current-format "#[fg=#c1ddff,bg=#ececec]\ue0b6#[fg=#5b7ea6,bg=#c1ddff]#I #[fg=#000000]#W#[fg=#c1ddff,bg=#ececec]\ue0b4"
    # Name a window after its folder while it sits at a shell prompt, and after
    # the running program otherwise. Windows renamed by hand keep their name.
    set -g automatic-rename-format '#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}},#{pane_current_command}}'

  # }}}

  # Style {{{
    set -g window-status-current-style fg='#000000',bg='#c1ddff',bold
    set -g window-status-style fg='#333333',bg='#ececec'
#    set -g window-status-activity-style fg='#2b2b2b',bg='#b7b2a5',bold

#    set -g window-status-current-style fg='#ffffff',bg='#808080',bold
#    set -g window-status-style fg='#000000',bg='#808080'
    # set -g window-status-activity-style fg='#2b2b2b',bg='#b7b2a5',bold
  # }}}
# }}}

# Panes {{{
#  set -g pane-border-bg white
#  set -g pane-border-fg black
#  set -g pane-active-border-bg white
#  set -g pane-active-border-fg black
  set -g pane-border-style fg='#d6d6d6'
  set -g pane-active-border-style fg='#83afd8'
  set -g display-panes-colour '#cbcbcb'
  set -g display-panes-active-colour '#417ab3'
# }}}

# Clock Mode {{{
  setw -g clock-mode-colour '#417ab3'
# }}}

# Messages {{{
  # set -g message-fg white
  # set -g message-bg black
#  set -g message-fg '#2b2b2b'
#  set -g message-bg '#d3d1cc'

#  set -g message-command-fg '#2b2b2b'
#  set -g message-command-bg '#d3d1cc'
  # set -g message-command-fg white
  # set -g message-command-bg black
# }}}

# Mode (window select / session sellect) {{{
#  set-window-option -g mode-fg white
#  set-window-option -g mode-bg black
# }}}
# vim: foldmethod=marker:sw=2:foldlevel=10
# MAC ONLY:
# set-option -g default-command "reattach-to-user-namespace -l $SHELL"

bind-key v split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key 1 select-window -t 1
bind-key 2 select-window -t 2
bind-key 3 select-window -t 3
bind-key 4 select-window -t 4
bind-key 5 select-window -t 5
bind-key 6 select-window -t 6
bind-key 7 select-window -t 7
bind-key 8 select-window -t 8
bind-key 9 select-window -t 9
bind-key 0 select-window -t 10

bind m send-keys 'ranger' Enter
bind-key r select-window -t ranger
bind-key u select-window -t unison
set -g focus-events on

# Machine-specific overrides
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

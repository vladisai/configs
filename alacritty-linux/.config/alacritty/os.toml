# Linux part of alacritty.toml, imported from there. Alt+key sends the tmux
# prefix followed by a key, like Cmd+key does on macOS.

[[keyboard.bindings]]
chars = "\u0002"
key = "J"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u0002("
key = "H"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u0002)"
key = "L"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00021"
key = "1"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00022"
key = "2"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00023"
key = "3"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00024"
key = "4"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00025"
key = "5"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00026"
key = "6"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00027"
key = "7"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00028"
key = "8"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00029"
key = "9"
mods = "Alt"

[[keyboard.bindings]]
chars = "\u00020"
key = "0"
mods = "Alt"
